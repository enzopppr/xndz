<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor HTML + Preview</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-2: #0d1e35;
      --panel: rgba(12, 21, 38, 0.88);
      --panel-strong: rgba(19, 30, 52, 0.95);
      --line: rgba(120, 160, 255, 0.18);
      --text: #edf7ff;
      --muted: #9ab1c9;
      --cyan: #50f1ff;
      --mint: #82ffbe;
      --pink: #ff5dcf;
      --violet: #8c7bff;
      --shadow: rgba(80, 241, 255, 0.35);
      --danger: #ff6c8a;
      --warning: #ffd76f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(92, 129, 255, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .app {
      width: min(1400px, 100%);
      background: rgba(11, 17, 30, 0.85);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: rgba(12, 20, 35, 0.9);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--mint));
      box-shadow: 0 0 18px var(--shadow);
    }

    .actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.2s ease;
      color: #07151b;
      background: linear-gradient(135deg, var(--cyan), var(--mint));
      box-shadow: 0 12px 24px rgba(80, 241, 255, 0.2);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    button.secondary {
      background: linear-gradient(135deg, #192b4f, #2e2a63);
      color: var(--text);
      box-shadow: 0 12px 24px rgba(116, 97, 254, 0.18);
    }

    button.warn {
      background: linear-gradient(135deg, #ffb870, #ff7b7b);
      color: #1d0d13;
      box-shadow: 0 12px 24px rgba(255, 122, 115, 0.22);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1.1fr 1.4fr;
      min-height: 760px;
    }

    .panel {
      border-right: 1px solid var(--line);
      background: rgba(13, 18, 31, 0.75);
    }

    .panel:last-child {
      border-right: none;
      background: rgba(6, 12, 22, 0.8);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(9, 16, 26, 0.9);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 12px rgba(130, 255, 190, 0.8);
      display: inline-block;
      margin-right: 8px;
    }

    textarea {
      width: 100%;
      height: calc(100% - 58px);
      resize: none;
      border: none;
      outline: none;
      background: rgba(6, 11, 18, 0.9);
      color: #eaf7ff;
      font: 0.85rem/1.6 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      padding: 18px 16px;
      tab-size: 2;
    }

    textarea::selection {
      background: rgba(80, 241, 255, 0.3);
    }

    .preview-shell {
      position: relative;
      width: 100%;
      height: calc(100% - 58px);
      background: #020812;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.76rem;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(13, 20, 34, 0.56), rgba(3, 8, 18, 0.72));
    }

    .empty-state.hidden {
      display: none;
    }

    @media (max-width: 980px) {
      body { padding: 16px; }

      .workspace {
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .panel:last-child {
        border-bottom: none;
      }

      .preview-shell {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>

  <script>
    const editor = document.getElementById('codeEditor');
    const previewFrame = document.getElementById('previewFrame');
    const charCount = document.getElementById('charCount');
    const previewStatus = document.getElementById('previewStatus');
    const emptyState = document.getElementById('emptyState');

    const defaultCode = `<!DOCTYPE html>

<body>
  <main class="game-wrapper">
    <header>
      <h1 class="logo">NEON SNAKE</h1>

      <div class="stats">
        <div class="stat">
          <small>PONTOS</small>

        </div>

        <div class="stat">
          <small>RECORDE</small>
          <strong id="highScore">0</strong>
        </div>
      </div>
    </header>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="900" height="600"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">NEON SNAKE</h2>
        <p id="overlayText">
          Use as <b>setas</b> ou <b>WASD</b> para controlar a cobra.<br>
          Pressione <b>P</b> para pausar.
        </p>
        <button id="startButton">COMEÇAR</button>
      </div>
    </div>

    <div class="controls">
      <div class="help">
        <b>WASD</b> ou <b>SETAS</b> para mover &nbsp; • &nbsp;
        <b>P</b> para pausar
      </div>

      <div class="buttons">
        <button id="pauseButton">PAUSAR</button>
        <button id="restartButton">REINICIAR</button>
      </div>
    </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("highScore");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startButton = document.getElementById("startButton");
    const pauseButton = document.getElementById("pauseButton");
    const restartButton = document.getElementById("restartButton");

    const COLS = 30;
    const ROWS = 20;
    const CELL = canvas.width / COLS;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score = 0;
    let highScore = Number(localStorage.getItem("neonSnakeHighScore")) || 0;
    let running = false;
    let paused = false;
    let gameOver = false;
    let lastTime = 0;
    let timer = 0;
    let speed = 125;
    let particles = [];
    let animationFrameId = null;

    highScoreElement.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 15, y: 10 },
        { x: 14, y: 10 },
        { x: 13, y: 10 },
        { x: 12, y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speed = 125;
      running = false;
      paused = false;
      gameOver = false;
      particles = [];

      scoreElement.textContent = score;
      pauseButton.textContent = "PAUSAR";
      createFood();
      draw();
    }

    function createFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function startGame() {
      if (gameOver) resetGame();
      running = true;
      paused = false;
      gameOver = false;
      overlay.classList.add("hidden");
      pauseButton.textContent = "PAUSAR";
      lastTime = performance.now();
      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      running = false;
      gameOver = true;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("neonSnakeHighScore", highScore);
        highScoreElement.textContent = highScore;
      }

      overlayTitle.textContent = "FIM DE JOGO";
      overlayText.innerHTML = `Você fez <b>${score}</b> pontos.<br>Pronto para tentar novamente?`;
      startButton.textContent = "JOGAR NOVAMENTE";
      overlay.classList.remove("hidden");
    }

    function togglePause() {
      if (!running && !gameOver) {
        startGame();
        return;
      }

      if (gameOver) return;

      paused = !paused;
      pauseButton.textContent = paused ? "CONTINUAR" : "PAUSAR";

      if (paused) {
        overlayTitle.textContent = "PAUSADO";
        overlayText.innerHTML = "Pressione <b>P</b> ou clique em continuar.";
        startButton.textContent = "CONTINUAR";
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
        lastTime = performance.now();
        cancelAnimationFrame(animationFrameId);
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function setDirection(x, y) {
      if (!direction) {
        direction = { x: 1, y: 0 };
      }

      if (x === -direction.x && y === -direction.y) return;
      nextDirection = { x, y };

      if (!running && !gameOver) startGame();
    }

    function update() {
      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        endGame();
        return;
      }

      if (snake.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreElement.textContent = score;

        if (score > highScore) {
          highScore = score;
          highScoreElement.textContent = highScore;
          localStorage.setItem("neonSnakeHighScore", highScore);
        }

        createParticles(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
        createFood();
        speed = Math.max(55, 125 - score * 3);
      } else {
        snake.pop();
      }

      updateParticles();
    }

    function gameLoop(time) {
      if (!running || paused) return;

      const delta = time - lastTime;
      lastTime = time;
      timer += delta;

      if (timer >= speed) {
        update();
        timer = 0;
      }

      draw();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function roundedRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#07152a");
      gradient.addColorStop(0.5, "#060b1c");
      gradient.addColorStop(1, "#130721");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(0, 245, 255, .065)";
      ctx.lineWidth = 1;

      for (let x = 0; x <= canvas.width; x += CELL) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = 0; y <= canvas.height; y += CELL) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      const glow = ctx.createRadialGradient(
        canvas.width / 2,
        canvas.height / 2,
        20,
        canvas.width / 2,
        canvas.height / 2,
        460
      );

      glow.addColorStop(0, "rgba(0, 180, 255, .07)");
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawFood() {
      const x = food.x * CELL + CELL / 2;
      const y = food.y * CELL + CELL / 2;
      const pulse = 1 + Math.sin(Date.now() / 150) * 0.08;

      ctx.save();
      ctx.shadowColor = "#ff3f9f";
      ctx.shadowBlur = 25;

      const gradient = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, 14);
      gradient.addColorStop(0, "#fff");
      gradient.addColorStop(0.25, "#ffb3df");
      gradient.addColorStop(0.65, "#ff3f9f");
      gradient.addColorStop(1, "#a6006b");

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, 9 * pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(x - 3, y - 4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        const padding = index === 0 ? 2 : 3;
        const x = part.x * CELL + padding;
        const y = part.y * CELL + padding;
        const size = CELL - padding * 2;

        ctx.save();
        ctx.shadowColor = index === 0 ? "#54ff8a" : "#00f5ff";
        ctx.shadowBlur = index === 0 ? 22 : 13;

        const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
        gradient.addColorStop(0, index === 0 ? "#d6ffe3" : "#75ffff");
        gradient.addColorStop(0.3, index === 0 ? "#54ff8a" : "#00f5ff");
        gradient.addColorStop(1, index === 0 ? "#0a9f61" : "#1165b9");

        ctx.fillStyle = gradient;
        roundedRect(x, y, size, size, index === 0 ? 7 : 6);

        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        roundedRect(x + 4, y + 3, size * 0.42, 3, 2);

        if (index === 0) {
          drawEyes(part, x, y, size);
        }

        ctx.restore();
      });
    }

    function drawEyes(part, x, y, size) {
      let eye1, eye2;

      if (direction.x !== 0) {
        const frontX = direction.x > 0 ? x + size - 6 : x + 6;
        eye1 = { x: frontX, y: y + 7 };
        eye2 = { x: frontX, y: y + size - 7 };
      } else {
        const frontY = direction.y > 0 ? y + size - 6 : y + 6;
        eye1 = { x: x + 7, y: frontY };
        eye2 = { x: x + size - 7, y: frontY };
      }

      ctx.fillStyle = "#06111e";
      ctx.beginPath();
      ctx.arc(eye1.x, eye1.y, 2.4, 0, Math.PI * 2);
      ctx.arc(eye2.x, eye2.y, 2.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(eye1.x - 0.7, eye1.y - 0.7, 0.8, 0, Math.PI * 2);
      ctx.arc(eye2.x - 0.7, eye2.y - 0.7, 0.8, 0, Math.PI * 2);
      ctx.fill();
    }

    function createParticles(x, y) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 1,
          size: Math.random() * 4 + 2
        });
      }
    }

    function updateParticles() {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.045;
      });

      particles = particles.filter(p => p.life > 0);
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = "#ff72bd";
        ctx.shadowColor = "#ff3f9f";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function draw() {
      drawBackground();
      drawFood();
      drawSnake();
      drawParticles();
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      const allowed = ["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", "p", " "];

      if (allowed.includes(key)) event.preventDefault();

      if (key === "arrowup" || key === "w") setDirection(0, -1);
      if (key === "arrowdown" || key === "s") setDirection(0, 1);
      if (key === "arrowleft" || key === "a") setDirection(-1, 0);
      if (key === "arrowright" || key === "d") setDirection(1, 0);
      if (key === "p" || key === " ") togglePause();
    });

    document.getElementById("startButton").addEventListener("click", () => {
      if (paused) togglePause();
      else startGame();
    });

    document.getElementById("pauseButton").addEventListener("click", togglePause);
    document.getElementById("restartButton").addEventListener("click", () => {
      resetGame();
      startGame();
    });

    function updateCounter() {
      charCount.textContent = `${editor.value.length} caracteres`;
    }

    function renderPreview() {
      const content = editor.value.trim();

      if (!content) {
        previewFrame.srcdoc = '';
        previewStatus.textContent = 'Vazio';
        emptyState.classList.remove('hidden');
        return;
      }

      previewFrame.srcdoc = content;
      previewStatus.textContent = 'Atualizado';
      emptyState.classList.add('hidden');
    }

    function clearCode() {
      if (!editor.value.trim()) return;

      const shouldClear = window.confirm('Deseja limpar todo o código do editor?');
      if (!shouldClear) return;

      editor.value = '';
      updateCounter();
      renderPreview();
    }

    async function copyCode() {
      if (!editor.value.trim()) return;

      try {
        await navigator.clipboard.writeText(editor.value);
        previewStatus.textContent = 'Copiado';
      } catch (error) {
        previewStatus.textContent = 'Falha ao copiar';
      }
    }

    document.getElementById('runBtn').addEventListener('click', renderPreview);
    document.getElementById('resetBtn').addEventListener('click', () => {
      editor.value = defaultCode;
      updateCounter();
      renderPreview();
    });
    document.getElementById('copyBtn').addEventListener('click', copyCode);
    document.getElementById('clearBtn').addEventListener('click', clearCode);

    editor.addEventListener('input', updateCounter);
    editor.addEventListener('keydown', (event) => {
      if (event.key === 'Tab') {
        event.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        updateCounter();
      }
    });

    editor.value = defaultCode;
    updateCounter();
    renderPreview();
    resetGame();
  </script>
</body>
</html>`;
